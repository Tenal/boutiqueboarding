# Runs Jest unit tests and posts a coverage summary comment on PRs. Fails if coverage drops below 80%.
name: Run Unit Tests and Generate Coverage Report

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests and Generate Coverage
        run: cd frontend && npm run test:coverage

      - name: Post Coverage Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('frontend/coverage/coverage-summary.json', 'utf8'));
            const t = summary.total;

            const pct = (v) => `${v.pct}%`;
            const icon = (v) => v.pct >= 80 ? '✅' : '❌';

            const body = [
              '## 🧪 Coverage Report',
              '',
              '| Metric | Coverage |',
              '|--------|----------|',
              `| Statements | ${icon(t.statements)} ${pct(t.statements)} |`,
              `| Branches   | ${icon(t.branches)} ${pct(t.branches)} |`,
              `| Functions  | ${icon(t.functions)} ${pct(t.functions)} |`,
              `| Lines      | ${icon(t.lines)} ${pct(t.lines)} |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.startsWith('## 🧪 Coverage Report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/lcov-report